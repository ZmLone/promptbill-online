name: Notify IndexNow on Production Deploy

on:
  deployment_status:
  workflow_dispatch:

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')

    steps:
      - name: Submit Sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 53697d52230c419786f2f90d580e2244

          SITE_HOST: tokenledger-six.vercel.app
        run: |
          node << 'EOF'
          const host = process.env.SITE_HOST;
          const key = process.env.INDEXNOW_KEY;

          (async () => {
            const sitemapRes = await fetch(`https://${host}/sitemap.xml`);
            if (!sitemapRes.ok) {
              throw new Error(`Failed to fetch sitemap: HTTP ${sitemapRes.status}`);
            }

            const xml = await sitemapRes.text();
            const urls = [...xml.matchAll(/<loc>(.*?)<\/loc>/g)].map((m) => m[1].trim());

            if (urls.length === 0) {
              throw new Error('No URLs found in sitemap.xml');
            }

            const payload = {
              host,
              key,
              keyLocation: `https://${host}/${key}.txt`,
              urlList: urls,
            };

            const res = await fetch('https://api.indexnow.org/indexnow', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json; charset=utf-8' },
              body: JSON.stringify(payload),
            });

            console.log(`Submitted ${urls.length} URLs to IndexNow — HTTP ${res.status}`);
            if (res.status !== 200 && res.status !== 202) {
              const text = await res.text();
              throw new Error(`IndexNow rejected request (${res.status}): ${text}`);
            }
          })();
          EOF
