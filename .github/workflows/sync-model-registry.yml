name: Sync Pending LLM Models, Prices & Benchmarks to Admin Queue

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  stage-registry-updates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Fetch OpenRouter prices, new models & benchmarks into pending queue
        env:
          BENCHMARK_FEED_URL: ${{ vars.BENCHMARK_FEED_URL }}
        run: |
          node scripts/sync-registry.mjs

      - name: Commit staged updates to src/data/pending-registry.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pending-registry.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(admin-queue): stage pending LLM models, prices & benchmarks"
            git push
          else
            echo "No changes to src/data/pending-registry.json"
          fi
